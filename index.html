<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>조용한 관종의 일본 · 일본 행사 캘린더</title>
<meta name="description" content="일본 팝업스토어·콜라보카페·전시·행사·축제·가챠·쿠지·플리마켓 일정을 한국어로 모아봅니다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
</head><body>
<header class="hd"><div class="wrap">
  <p class="kicker">조용한 관종의 일본</p>
  <h1>일본 행사 캘린더</h1>
  <p class="sub">팝업스토어 · 콜라보카페 · 전시·행사 · 축제 · 가챠 · 쿠지 · 플리마켓</p>
  <div class="meta"><span id="base">기준일: -</span><a href="https://blog.naver.com/rownsh00" target="_blank" rel="noopener">블로그 바로가기 →</a></div>
</div></header>
<main class="wrap">
  <div id="banner" class="banner" hidden>⚠️ 현재 예시 데이터입니다. 실제 일정은 공식 사이트에서 확인해 주세요.</div>
  <section id="wx" class="wx" aria-label="도쿄 날씨"><div class="wx-hd"><b>도쿄 7일 날씨</b><span>날씨 정보: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · 행사 정보와 별개</span></div><div id="wxrow" class="wxrow"><span class="wx-msg">날씨 불러오는 중…</span></div></section>
  <section class="filters">
    <div id="chips" class="chips"></div>
    <div class="row">
      <select id="area"><option value="">전체 지역</option></select>
      <input id="q" type="search" placeholder="작품명·행사명 검색">
    </div>
    <div class="toggle" id="status">
      <button data-s="all" class="on">전체</button><button data-s="now">진행 중·입고 중</button><button data-s="soon">예정·입고 예정</button>
    </div>
  </section>
  <p id="count" class="count"></p>
  <section id="list" class="list"></section>
</main>
<footer class="wrap ft">정보는 작성 시점 기준이며 변경될 수 있어요. 방문 전 공식 안내를 꼭 확인해 주세요.<br>© 조용한 관종의 일본</footer>
<script src="app.js"></script>
<script src="weather.js"></script>
</body></html>
